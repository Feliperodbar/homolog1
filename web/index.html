<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Homolog - Evidências QA</title>
    <link rel="icon" href="/assets/icon.svg" />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <a class="skip-link" href="#timeline">Ir para a linha do tempo</a>
    <header class="topbar">
      <div>
        <span class="eyebrow">QA EVIDENCE MANAGER</span>
        <h1>Homolog</h1>
      </div>
      <div class="top-actions">
        <span id="recordingIndicator" class="indicator">Sessão local</span
        ><span id="saveIndicator" class="indicator" role="status" aria-live="polite">Salvo</span
        ><span id="stepCounter" class="counter">0 passos</span><button id="themeBtn" aria-label="Alternar tema">◐</button>
      </div>
    </header>
    <main>
      <section class="toolbar" aria-label="Projetos e relatórios">
        <div class="fixed-context">
          <span class="fixed-context-label">Projeto</span><strong id="projectSelect"></strong>
        </div>
        <div class="fixed-context">
          <span class="fixed-context-label">Sessão</span><strong id="sessionSelect"></strong>
        </div>
        <span class="spacer"></span
        ><button id="backupBtn" class="icon-button" aria-label="Exportar backup" title="Exportar backup">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 15v5h14v-5" /></svg></button
        ><label class="file-button icon-button" aria-label="Importar backup" title="Importar backup"
          ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21V9m0 0 5 5m-5-5-5 5M5 9V4h14v5" /></svg
          ><input id="importInput" type="file" accept="application/json" /></label
        ><button id="htmlBtn" class="icon-button" aria-label="Exportar relatório HTML" title="Exportar HTML">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4m8-8 4 4-4 4m-5 3 2-14" /></svg></button
        ><button id="docxBtn" class="icon-button branded-file-icon" aria-label="Exportar relatório DOCX" title="Exportar DOCX">
          <img src="/assets/icons/word-flaticon-1009339.png" alt="" /></button
        ><button id="pdfBtn" class="icon-button branded-file-icon" aria-label="Exportar relatório PDF" title="Exportar PDF">
          <img src="/assets/icons/pdf-flaticon-9496461.png" alt="" />
        </button>
      </section>
      <section class="project-card">
        <div class="section-heading">
          <div>
            <span class="eyebrow">CONTEXTO</span>
            <h2>Dados do projeto</h2>
          </div>
          <button id="saveProjectBtn" class="primary">Salvar projeto</button>
        </div>
        <div class="form-grid">
          <label>Nome do projeto<input id="projectName" /></label><label>Funcionalidade<input id="feature" /></label
          ><label>Ambiente<input id="environment" value="Web" readonly /></label><label>Versão ou build<input id="version" /></label
          ><label>Responsável<input id="responsible" /></label><label>Data<input id="projectDate" type="date" /></label
          ><label>Navegador<input id="browser" /></label
          ><label
            >Resultado geral<select id="overallResult">
              <option value="">Não informado</option>
              <option>Aprovado</option>
              <option>Reprovado</option>
              <option>Bloqueado</option>
            </select></label
          >
        </div>
      </section>
      <section class="controls">
        <div>
          <span class="eyebrow">LINHA DO TEMPO</span>
          <h2>Evidências da sessão</h2>
        </div>
        <label>Buscar<input id="searchInput" type="search" placeholder="Título, descrição, URL..." /></label
        ><label
          >Status<select id="statusFilter">
            <option value="">Todos</option>
            <option value="not-run">Não executado</option>
            <option value="passed">Aprovado</option>
            <option value="failed">Reprovado</option>
            <option value="blocked">Bloqueado</option>
            <option value="skipped">Ignorado</option>
          </select></label
        ><button id="addStepBtn" class="icon-button" aria-label="Adicionar passo manual" title="Adicionar passo manual">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></button
        ><button id="clearSessionBtn" class="danger icon-button" aria-label="Limpar sessão" title="Limpar sessão">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-9 0 1 14h10l1-14M10 11v6m4-6v6" /></svg>
        </button>
      </section>
      <section id="timeline" class="timeline" aria-live="polite"></section>
      <div id="emptyState" class="empty">
        <strong>Nenhuma evidência ainda.</strong>
        <p>Inicie uma gravação pela extensão ou adicione um passo manual.</p>
      </div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="screenshotInput" type="file" accept="image/*" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
